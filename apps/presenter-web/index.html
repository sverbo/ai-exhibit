<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ede2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Saved light/dark theme before the first paint (src/theme.ts owns it afterwards).
      try {
        var saved = JSON.parse(localStorage.getItem("ai-exhibit:theme") || "null");
        if (saved && (saved.theme === "dark" || saved.theme === "light")) document.documentElement.dataset.theme = saved.theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23110f0d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f2a93b'/%3E%3C/svg%3E" />
    <title>ai-exhibit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
